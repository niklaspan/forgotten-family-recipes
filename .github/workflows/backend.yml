name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build backend/HandedDown.csproj --configuration Release

      - name: Publish
        run: dotnet publish backend/HandedDown.csproj --configuration Release --output ./publish --no-self-contained

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: ffr-dev-func
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTION_PUBLISH_PROFILE }}
