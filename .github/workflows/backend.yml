name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build backend/HandedDown.csproj --configuration Release

      - name: Publish
        run: |
          dotnet publish backend/HandedDown.csproj --configuration Release --output ./publish --no-self-contained
          cd publish && zip -r ../function.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --resource-group ffr-dev-rg \
            --name ffr-dev-func \
            --src function.zip
